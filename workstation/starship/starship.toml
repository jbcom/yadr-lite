# Josean-dev Powerlevel10k style prompt for Starship
# Two-line prompt with box drawing connectors
# Compatible with omarchy-theme-sync

# Palette set by omarchy-theme-sync
palette = 'seashells'

format = """
[╭─](bright-black) $username[@](at)$hostname $directory$git_branch$git_status$nodejs$golang$python$ruby$php$rust$fill$memory_usage$battery$time
[╰─](bright-black)$character"""

add_newline = true

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
format = "$symbol "

[username]
style_user = "user"
style_root = "red bold"
format = "[$user]($style)"
show_always = true

[hostname]
style = "host"
format = "[$hostname]($style)"
ssh_only = false

[directory]
format = "[󰉋 $path]($style) "
style = "path"
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = "[ $branch]($style) "
style = "git"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "prompt"
untracked = "?"
modified = "!"
staged = "+"
deleted = "✘"
renamed = "»"
stashed = "\\$"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="

[nodejs]
format = " [ $version](bold green) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
format = " [ $version](yellow) "
detect_files = ["requirements.txt", ".python-version", "Pipfile", "pyproject.toml", "setup.py"]

[golang]
format = " [ $version](bold cyan) "
detect_files = ["go.mod", "go.sum", ".go-version"]
detect_folders = ["Godeps"]

[ruby]
format = " [ $version](bold red) "
detect_files = ["Gemfile", ".ruby-version"]
detect_folders = []

[php]
format = " [ $version](89) "
detect_files = ["composer.json", ".php-version"]

[rust]
format = " [ $version](bold red) "
detect_files = ["Cargo.toml"]

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "🔌 "
format = " [$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[memory_usage]
disabled = false
threshold = -1
symbol = "󰍛 "
style = "bold dimmed white"
format = "[$symbol${ram}( | ${swap})]($style) "

[fill]
symbol = " ·"
style = "bright-black"

[time]
disabled = false
format = "[󰥔 $time]($style)"
style = "time"
time_format = "%I:%M:%S %p"

# Palette managed by omarchy-theme-sync
# Run 'omarchy-theme-sync' after theme changes
[palettes.seashells]
bracket = '#fba02f'
time = '#50a3b5'
user = '#68d3f0'
at = '#027b9b'
host = '#027b9b'
path = '#2d6870'
prompt = '#fba02f'
git = '#50a3b5'
