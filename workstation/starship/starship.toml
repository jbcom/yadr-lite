# YADRLite Bracketed Starship Configuration
# Highly-optimized information density with box drawing connectors
# Compatible with omarchy-theme-sync palette

"$schema" = 'https://starship.rs/config-schema.json'
palette = 'seashells'

format = """
[╭─](bright-black) $username$hostname$directory$git_branch$git_state$git_status$git_metrics$docker_context$aws$gcloud$azure$terraform$nodejs$golang$python$ruby$php$rust$bun$fill$memory_usage$battery$time
[╰─](bright-black)$jobs$character"""

add_newline = true

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
format = "$symbol "

[username]
style_user = "user"
style_root = "red bold"
format = '\[[$user]($style)\]'
show_always = true

[hostname]
style = "host"
format = '\[[$hostname]($style)\] '
ssh_only = false

[directory]
format = '\[[󰉋 $path]($style)\] '
style = "path"
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = '\[[$symbol$branch]($style)\]'
style = "git"
symbol = ""

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = "prompt"
untracked = "?"
modified = "!"
staged = "+"
deleted = "✘"
renamed = "»"
stashed = "\\$"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'
style = "bright-black"

[git_metrics]
disabled = false
format = '\[[+$added]($added_style)\]\[[-$deleted]($deleted_style)\]'
added_style = "bold green"
deleted_style = "bold red"

[jobs]
symbol = "✦ "
format = '\[[$symbol$number]($style)\]'
style = "bold blue"

[docker_context]
format = '\[[$symbol$context]($style)\]'
only_with_files = false

[aws]
format = '\[[$symbol($profile)(\($region\))]($style)\]'
style = "yellow bold"
symbol = " "

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
style = "bold blue"

[azure]
format = '\[[$symbol$subscription]($style)\]'
style = "blue bold"
disabled = false

[terraform]
format = '\[[$symbol$workspace]($style)\]'

[nodejs]
format = '\[[$symbol($version)]($style)\]'
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
style = "yellow"

[golang]
format = '\[[$symbol($version)]($style)\]'
style = "bold cyan"

[ruby]
format = '\[[$symbol($version)]($style)\]'
style = "bold red"

[php]
format = '\[[$symbol($version)]($style)\]'
style = "89"

[rust]
format = '\[[$symbol($version)]($style)\]'
style = "bold red"

[bun]
format = '\[[$symbol($version)]($style)\]'

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "🔌 "
format = '\[[$symbol$percentage]($style)\]'

[[battery.display]]
threshold = 20
style = "bold red"

[memory_usage]
disabled = false
threshold = -1
symbol = "󰍛 "
style = "bold dimmed white"
format = '\[$symbol[$ram( | $swap)]($style)\]'

[fill]
symbol = " ·"
style = "bright-black"

[time]
disabled = false
format = '\[[$time]($style)\]'
style = "time"
time_format = "%I:%M:%S %p"

[cmd_duration]
min_time = 2000
format = '\[[⏱ $duration]($style)\]'
style = "bold yellow"

# Right prompt for execution time (Zsh)
right_format = """$cmd_duration"""

# Continuation prompt (Zsh)
continuation_prompt = "[▶▶ ](bright-black)"

# Palette managed by omarchy-theme-sync
# Run 'omarchy-theme-sync' after theme changes
[palettes.seashells]
bracket = '#fba02f'
time = '#50a3b5'
user = '#68d3f0'
at = '#027b9b'
host = '#027b9b'
path = '#2d6870'
prompt = '#fba02f'
git = '#50a3b5'
